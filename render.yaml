services:
  - type: web
    name: ai-meeting-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
      - key: GRADIO_SERVER_NAME
        value: "0.0.0.0"
